<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anh xin lỗi</title>
    <style>
        /* Thiết lập cơ bản cho trang */
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Ẩn thanh cuộn */
        }

        /* Tạo nền màu nhẹ nhàng (gradient) */
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; /* Dùng Flexbox để căn giữa */
            justify-content: center; /* Căn giữa ngang */
            align-items: center; /* Căn giữa dọc */
            text-align: center;
        }

        /* Định dạng dòng chữ */
        h1 {
            font-size: 5rem; /* Kích thước chữ rất to */
            color: #333; /* Màu chữ đen xám sang trọng */
            margin: 0;
            padding: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1); /* Đổ bóng nhẹ */
            
            /* Hiệu ứng xuất hiện */
            animation: fadeIn 2s ease-in-out;
        }

        /* Thêm emoji trái tim đập nhẹ nếu muốn */
        .heart {
            color: #e25555;
            display: inline-block;
            animation: beat 1s infinite alternate;
        }

        /* Hiệu ứng mờ dần khi mới mở trang */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Hiệu ứng trái tim đập */
        @keyframes beat {
            to { transform: scale(1.1); }
        }

        /* Điều chỉnh cho điện thoại (màn hình nhỏ) */
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem; /* Nhỏ hơn một chút trên điện thoại để không bị tràn */
            }
        }
    </style>
</head>
<body>

    <h1>
        Anh xin lỗi em ! 
        <span class="heart">❤️</span>
    </h1>

</body>
</html>
